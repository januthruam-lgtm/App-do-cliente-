<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARMITARIA DEGGUST - Cardápio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-xl mx-auto flex items-center gap-3">
      <img src="logo.png" alt="Logo" class="w-12 h-12 rounded-full border border-orange-500 object-cover" onerror="this.src='https://via.placeholder.com/48'">
      <div>
        <h1 class="font-bold text-lg text-white">MARMITARIA DEGGUST</h1>
        <p class="text-xs text-emerald-400 flex items-center gap-1 font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Cardápio Atualizado
        </p>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">
    <h2 class="text-sm font-semibold text-slate-400 tracking-wider uppercase">Escolha a sua marmita</h2>

    <!-- Lista Dinâmica de Marmitas -->
    <div id="cardapioContainer" class="space-y-3">
      <p class="text-xs text-slate-500 text-center py-8">Buscando cardápio do dia...</p>
    </div>
  </main>

  <!-- Barra de Finalização de Pedido -->
  <footer id="carrinhoBar" class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 p-4 hidden">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-4">
      <div>
        <p class="text-xs text-slate-400">Total do Pedido</p>
        <p id="totalValor" class="text-lg font-bold text-orange-400">R$ 0,00</p>
      </div>
      <button onclick="enviarWhatsApp()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-3 rounded-xl transition flex items-center gap-2 shadow-lg shadow-emerald-600/20">
        <i data-lucide="message-circle"></i> Enviar Pedido
      </button>
    </div>
  </footer>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCT-DpI06em24o7cjgV67x2GaHom7BzLpM",
      authDomain: "marmitaria-deggust.firebaseapp.com",
      projectId: "marmitaria-deggust",
      storageBucket: "marmitaria-deggust.firebasestorage.app",
      messagingSenderId: "750433597063",
      appId: "1:750433597063:web:b82cabcb8111411cd46a22",
      measurementId: "G-7CYHMY89YV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let carrinho = {};

    lucide.createIcons();

    // Sincronizar Cardápio em Tempo Real
    onSnapshot(collection(db, "cardapio"), (snapshot) => {
      const container = document.getElementById('cardapioContainer');
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">Nenhum prato disponível no momento.</p>`;
        return;
      }

      snapshot.forEach((docItem) => {
        const prato = docItem.data();
        const id = docItem.id;

        const itemEl = document.createElement('div');
        itemEl.className = "bg-slate-800 border border-slate-700/80 p-4 rounded-2xl flex items-center justify-between gap-4 shadow-md";
        itemEl.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${prato.imagem}" class="w-16 h-16 rounded-xl object-cover bg-slate-900 border border-slate-700">
            <div>
              <h3 class="font-bold text-white text-base">${prato.nome}</h3>
              <p class="text-xs text-slate-400 line-clamp-2 mt-0.5">${prato.descricao}</p>
              <p class="text-sm font-bold text-orange-400 mt-1">R$ ${(prato.preco || 0).toFixed(2)}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-700">
            <button onclick="alterarQtd('${id}', '${prato.nome}', ${prato.preco}, -1)" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-bold flex items-center justify-center">-</button>
            <span id="qtd-${id}" class="text-sm font-bold w-4 text-center">0</span>
            <button onclick="alterarQtd('${id}', '${prato.nome}', ${prato.preco}, 1)" class="w-7 h-7 rounded-lg bg-orange-600 hover:bg-orange-500 text-white font-bold flex items-center justify-center">+</button>
          </div>
        `;
        container.appendChild(itemEl);
      });
      lucide.createIcons();
    });

    window.alterarQtd = (id, nome, preco, delta) => {
      if (!carrinho[id]) carrinho[id] = { nome, preco, qtd: 0 };
      carrinho[id].qtd += delta;

      if (carrinho[id].qtd <= 0) delete carrinho[id];

      document.getElementById(`qtd-${id}`).innerText = carrinho[id] ? carrinho[id].qtd : 0;
      atualizarCarrinho();
    };

    function atualizarCarrinho() {
      let total = 0;
      let qtdTotal = 0;

      Object.values(carrinho).forEach(item => {
        total += item.preco * item.qtd;
        qtdTotal += item.qtd;
      });

      const bar = document.getElementById('carrinhoBar');
      if (qtdTotal > 0) {
        bar.classList.remove('hidden');
        document.getElementById('totalValor').innerText = `R$ ${total.toFixed(2)}`;
      } else {
        bar.classList.add('hidden');
      }
    }

    window.enviarWhatsApp = () => {
      let msg = "*NOVO PEDIDO - MARMITARIA DEGGUST*\n\n";
      let total = 0;

      Object.values(carrinho).forEach(item => {
        msg += `• ${item.qtd}x ${item.nome} - R$ ${(item.preco * item.qtd).toFixed(2)}\n`;
        total += item.preco * item.qtd;
      });

      msg += `\n*Total: R$ ${total.toFixed(2)}*`;

      const numeroWhatsApp = "5527999999999"; // INSIRA SEU NÚMERO AQUI (COM DDD)
      window.open(`https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(msg)}`, '_blank');
    };
  </script>
</body>
</html>
